<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lợi Ích Của Công Nghệ Số</title>
    <style>
        /* CSS Style - Created by Gemini AI */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-container {
            max-width: 800px;
            width: 100%;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            box-sizing: border-box;
        }

        h1 {
            color: #1a365d;
            margin-bottom: 25px;
        }

        .content-section {
            margin-bottom: 40px;
        }

        .content-section h2 {
            color: #2b6cb0;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 20px;
        }

        /* Hiển thị hình ảnh Infographic responsive */
        .infographic-img {
            max-width: 100%;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        /* Khung phát video Youtube tỉ lệ 16:9 chuẩn responsive */
        .video-wrapper {
            position: relative;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Phong cách cho ghi chú bản quyền ở chân trang */
        footer {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
            font-size: 13px;
            color: #718096;
        }
    </style>
</head>
<body>

    <div class="main-container">
        <h1>Lợi Ích Của Công Nghệ Số</h1>

        <!-- Hiển thị Infographic -->
        <section class="content-section">
            <h2>1. Infographic Lợi Ích Công Nghệ Số</h2>
            <img src="Lab05_Ex2.1.png" alt="Infographic Lợi ích của công nghệ số" class="infographic-img">
        </section>

        <!-- Hiển thị Video Youtube -->
        <section class="content-section">
            <h2>2. Video Xem Thêm</h2>
            <div class="video-wrapper">
                <div class="video-wrapper">
    <iframe 
        src="https://www.youtube-nocookie.com/embed/XhYXtJkfkqE" 
        title="YouTube video player" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
        referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
    </iframe>
            </div>
        </section>

        <!-- Hiển thị thông tin bản quyền trên giao diện trang web -->
        <footer>
            <p>© Code được tạo bởi Gemini AI. Tất cả các quyền được bảo lưu.</p>
        </footer>
    </div>

</body>
</html>
